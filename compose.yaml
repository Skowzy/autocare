services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: '${DB_DATABASE:-autocare}'
            POSTGRES_USER: '${DB_USERNAME:-autocare}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-autocare}'
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-autocare} -d ${DB_DATABASE:-autocare}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres:
